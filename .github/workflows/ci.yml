name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      MLFLOW_TRACKING_URI: sqlite:///mlruns.db
      JWT_SECRET_KEY: ci-test-secret
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_USER: nexus_user
      POSTGRES_DB: nexus_db
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      ALEMBIC_DATABASE_URL: sqlite:///./nexus_fallback.db
      GEMINI_API_KEY: ""
      PINECONE_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic -c alembic.ini upgrade head

      - name: Run backend + RAG eval offline tests
        run: pytest ../tests/test_core.py ../tests/test_api_endpoints.py ../tests/test_rag_eval.py -k "not agent_routing_fallback and not ragas_online" -q

      - name: Validate LangGraph orchestrator imports correctly
        run: python -c "
import ast, sys
with open('app/agent/orchestrator.py') as f:
    tree = ast.parse(f.read())
# Verify langgraph is actually imported (not just in requirements)
imports = [n for n in ast.walk(tree) if isinstance(n, (ast.Import, ast.ImportFrom))]
langgraph_used = any('langgraph' in getattr(n, 'module', '') or
                     any('langgraph' in getattr(a, 'name', '') for a in getattr(n, 'names', []))
                     for n in imports)
assert langgraph_used, 'LangGraph not imported in orchestrator.py'
print('LangGraph import verified in orchestrator.py')
"

      - name: Validate drift module imports correctly
        run: python -c "
import sys; sys.path.insert(0, '.')
from app.monitoring.drift import record_prediction, get_drift_report
report = get_drift_report()
assert report['n_models'] == 8, f'Expected 8 models, got {report[\"n_models\"]}'
record_prediction('fraud', 0.85)
record_prediction('sentiment_pos', 0.92)
print('Drift module OK — 8 models tracked, record_prediction works')
"

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install scanning tools
        run: pip install bandit pip-audit

      - name: Static security scan (Bandit)
        run: bandit -r app -q

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend audit (high severity)
        run: npm audit --audit-level=high
